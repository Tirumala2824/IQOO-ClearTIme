name: cleartime
description: "ClearTime - Child-first digital wellbeing application foundation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env

