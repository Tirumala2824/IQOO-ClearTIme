name: cleartime
description: "ClearTime - Child-first digital wellbeing application foundation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  uuid: ^4.5.1
  crypto: ^3.0.6
  cryptography: ^2.7.0
  intl: ^0.20.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  http: ^1.6.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  llama_cpp_dart: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env

